# Rules for `bash-classify match`, used by block-glab-ci-direct.sh.
# Schema: https://github.com/fprochazka/bash-classify/schemas/match-rules.schema.json
#
# The shapes the glab-pipeline PreToolUse hook denies: inspecting pipelines, jobs and job
# logs through glab's own commands or through the raw API. Agents are meant to use the
# glab-pipeline CLI, which dumps the whole pipeline state in one pass.
#
# `command` is a prefix match on the *resolved* command path, so a wrapper (`sudo`,
# `timeout`, `bash -c`, `xargs`, `eval`), an absolute binary path, or glab's own deprecated
# `pipe`/`pipeline` aliases for `ci` do not evade a rule — while a heredoc body or an
# `echo` string that merely names one of these commands is not an invocation and does not
# match. The alias resolution needs bash-classify >= 0.11.0.
rules:
  - name: ci-view
    command: [glab, ci, view]

  - name: ci-get
    command: [glab, ci, get]

  - name: ci-trace
    command: [glab, ci, trace]

  - name: pipelines-api
    command: [glab, api]
    any_arg_matches: 'projects/\S+/pipelines/'

  - name: job-trace-api
    command: [glab, api]
    any_arg_matches: 'projects/\S+/jobs/\S+/trace'

  - name: ci-lint-api
    command: [glab, api]
    any_arg_matches: 'projects/\S+/ci/lint'
