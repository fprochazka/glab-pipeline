[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "glab-pipeline"
dynamic = ["version"]
description = "Deprecated: the glab-pipeline command now ships in glab-cli-extras. This package installs it from there and prints a deprecation notice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Filip Procházka", email = "mr@fprochazka.cz"}
]
keywords = ["gitlab", "pipeline", "ci", "cli", "merge-request"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "glab-cli-extras>=0.3,<1",
]

[project.scripts]
glab-pipeline = "glab_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/fprochazka/glab-pipeline"
Repository = "https://github.com/fprochazka/glab-pipeline"
Issues = "https://github.com/fprochazka/glab-pipeline/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/glab_pipeline"]
